<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RPent · Live Monitor</title>
<style>
  :root {
    --bg: #f6f1e8; --panel: #fffdf8; --panel2: #efe7d8; --border: #d8cfbe;
    --fg: #3b3934; --muted: #877f70; --accent: #2f6fd6;
    --green: #2f8a3e; --red: #c8392f; --yellow: #b07a0a; --purple: #7a52c4;
    --tool: #1d6fc5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header h1 .dot { color: var(--accent); }
  select {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 11px; font-size: 15px; max-width: 460px;
  }
  .badge {
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .5px; border: 1px solid transparent;
  }
  .b-running { background: rgba(47,138,62,.14); color: var(--green); border-color: var(--green); animation: pulse 1.6s infinite; }
  .b-done { background: rgba(47,111,214,.14); color: var(--accent); border-color: var(--accent); }
  .b-stale { background: rgba(135,127,112,.16); color: var(--muted); border-color: var(--muted); }
  .b-ok { background: rgba(47,138,62,.14); color: var(--green); border-color: var(--green); }
  .b-fail { background: rgba(200,57,47,.12); color: var(--red); border-color: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  .meta { color: var(--muted); font-size: 13px; }
  .meta b { color: var(--fg); font-weight: 600; }
  .grow { flex: 1; }

  main { flex: 1; display: grid; grid-template-columns: var(--leftw, 1.4fr) 6px 1fr; gap: 0; min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .col.right { display: grid; grid-template-rows: var(--frameh, 42vh) 6px 1fr; min-height: 0; }

  /* draggable splitters */
  .gutter { background: var(--border); position: relative; z-index: 5; }
  .gutter::after { content: ""; position: absolute; inset: 0; }
  .gutter:hover, .gutter.dragging { background: var(--accent); }
  .gutter-v { cursor: col-resize; }
  .gutter-v::after { left: -3px; right: -3px; }   /* fatter hit area */
  .gutter-h { cursor: row-resize; }
  .gutter-h::after { top: -3px; bottom: -3px; }
  body.resizing { cursor: inherit; user-select: none; }
  body.resizing iframe, body.resizing .frame-media { pointer-events: none; }
  .panel-title {
    padding: 10px 16px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .panel-title .count { color: var(--fg); font-weight: 600; }

  /* transcript */
  #transcript { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .ev { margin-bottom: 8px; }
  .ev.turn { color: var(--purple); font-weight: 600; font-size: 13.5px;
    border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 10px; }
  .ev.text { white-space: pre-wrap; word-wrap: break-word; }
  .ev.thinking details {
    background: rgba(210,153,34,.08); border: 1px solid rgba(210,153,34,.35);
    border-radius: 6px; padding: 6px 9px;
  }
  .ev.thinking summary {
    color: var(--yellow); cursor: pointer; font-size: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .ev.thinking pre {
    white-space: pre-wrap; word-wrap: break-word; margin: 8px 0 0;
    color: var(--fg); font: inherit;
  }
  .ev.meta { color: var(--muted); font-size: 13px; font-style: italic; }
  .ev.tool_call, .ev.tool_result {
    font-size: 13.5px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 9px; overflow-x: auto;
  }
  .ev.tool_call { border-left: 3px solid var(--tool); }
  .ev.tool_result { border-left: 3px solid var(--muted); opacity: .85; }
  .ev .tname { color: var(--accent); font-weight: 600; }
  .ev .tname.err { color: var(--red); }
  .ev .args { color: var(--muted); }

  /* collapsible tool-call group */
  .toolgroup { margin: 6px 0; }
  .tg-head {
    font-size: 13.5px;
    color: var(--muted); cursor: pointer; user-select: none; padding: 3px 6px;
    border-radius: 6px; display: inline-block;
  }
  .tg-head:hover { color: var(--fg); background: var(--panel2); }
  .tg-head::before { content: "▸ "; color: var(--tool); }
  .tg-body { display: none; margin-top: 4px; }
  .toolgroup.open > .tg-body,
  #transcript.alltools .tg-body { display: block; }
  .toolgroup.open > .tg-head::before,
  #transcript.alltools .tg-head::before { content: "▾ "; }
  #transcript.alltools .tg-head { pointer-events: none; }
  .tg-body .ev { margin-bottom: 5px; }

  /* frame + compact BEHAVIOR manual controls */
  .framewrap {
    background: #e3dccd; border-bottom: 1px solid var(--border);
    position: relative; min-height: 200px; display: grid;
    grid-template-columns: minmax(168px, .52fr) minmax(260px, 1fr) minmax(168px, .5fr);
    overflow: hidden;
  }
  .framewrap:not(.behavior-mode),
  .framewrap.controls-collapsed { grid-template-columns: 1fr; }
  .frame-stage {
    grid-column: 2; position: relative; min-width: 0; min-height: 0;
    background: #e3dccd; overflow: hidden;
  }
  .framewrap:not(.behavior-mode) .frame-stage,
  .framewrap.controls-collapsed .frame-stage { grid-column: 1; }
  .frame-media {
    position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
    /* Hidden buffers still occupy layout — visibility keeps intrinsic sizing
       correct so the visible sibling doesn't re-flow on swap. Pointer events
       are disabled so the hidden video's controls don't intercept clicks. */
    visibility: hidden; pointer-events: none;
  }
  .frame-media.visible { visibility: visible; pointer-events: auto; }
  .frame-tabs { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 2; }
  .frame-tabs button {
    background: rgba(255,253,248,.85); color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  .frame-tabs button.active { color: var(--fg); border-color: var(--accent); background: var(--panel); }
  .behavior-frame-tabs { display: none; z-index: 5; top: 4px; right: 2px; gap: 7.5px; }
  .behavior-frame-tabs button {
    height: 23px; padding: 3px 8px; font-size: 12px;
  }
  .behavior-frame-tabs button[data-camera="head"] { width: 48px; }
  .behavior-frame-tabs button[data-camera="left_wrist"] { width: 63px; }
  .behavior-frame-tabs button[data-camera="right_wrist"] { width: 70px; }
  .framewrap.behavior-mode .legacy-frame-tabs { display: none; }
  .framewrap.behavior-mode .behavior-frame-tabs { display: flex; }
  .frame-cap { position: absolute; bottom: 8px; left: 10px; font-size: 13px; color: #f6f1e8;
    background: rgba(74,60,46,.72); padding: 3px 9px; border-radius: 4px; z-index: 6; }

  .control-rail {
    position: relative; z-index: 3; min-width: 0; padding: 8px 9px 7px;
    background:
      radial-gradient(circle at 45% 20%, rgba(255,255,255,.52), transparent 42%),
      rgba(246,241,232,.96);
    color: var(--fg); font-size: 12px; line-height: 1.15;
    display: none; flex-direction: column; align-items: center;
  }
  .framewrap.behavior-mode:not(.controls-collapsed) .control-rail { display: flex; }
  .control-left { grid-column: 1; border-right: 1px solid rgba(216,207,190,.65); }
  .control-right { grid-column: 3; border-left: 1px solid rgba(216,207,190,.65); }
  .controls-toggle {
    width: min(162px, 100%); height: 27px; flex: 0 0 27px; margin: 0 0 12px;
    display: inline-flex; align-items: center; justify-content: space-between;
    padding: 0 10px; border: 1px solid #c9bfad; border-radius: 5px;
    background: rgba(255,253,248,.92); color: #766e61; font: inherit;
    box-shadow: 0 1px 2px rgba(73,61,48,.13); cursor: pointer;
  }
  .controls-toggle:hover { background: #f1eadf; border-color: #b8ad9a; }
  .controls-toggle:active { transform: translateY(1px); background: #e6ddd0; }
  .controls-toggle .chevron { font-size: 13px; line-height: 1; transition: transform .12s ease; }
  .controls-toggle[aria-expanded="false"] .chevron { transform: rotate(180deg); }
  .collapsed-toggle {
    display: none; position: absolute; top: 8px; left: 9px; z-index: 5;
    width: 162px; margin: 0;
  }
  .framewrap.behavior-mode.controls-collapsed .collapsed-toggle { display: inline-flex; }
  .target-row { display: flex; gap: 8px; justify-content: center; width: 100%; min-height: 26px; }
  .target-button {
    box-sizing: border-box; width: 76px; height: 26px; flex: 0 0 76px;
    margin: 0; padding: 0 7px; color: #655f55; background: #f7f3eb;
    border: 1px solid #bdb4a5; border-radius: 5px;
    font: 12px/24px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    white-space: nowrap; box-shadow: 0 2px 3px rgba(67,56,43,.22);
    cursor: pointer;
  }
  .target-button:hover { background: #ede6da; border-color: #a99e8c; }
  .target-button:active, .target-button.pressed {
    transform: translateY(1px); background: #ddd3c4; box-shadow: 0 1px 1px rgba(67,56,43,.18);
  }
  .target-button.selected {
    color: #31567d; border-color: #8ba5bd; background: #e6edf2;
    box-shadow: 0 2px 3px rgba(67,56,43,.22);
  }
  .control-left .target-row { margin-bottom: 25px; }
  .control-left .controls-toggle { left: -2px; position: relative; }
  .control-left .target-row { transform: translateX(-4.5px); }
  .control-right .target-row {
    gap: 9px; margin-top: 61px; margin-bottom: 36px; transform: translateX(5px);
  }
  .control-section { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .dpad-wrap { position: relative; width: 152px; height: 151px; margin-top: 0; }
  .dpad {
    position: absolute; left: 21.58px; top: 26px; width: 96px; height: 96px;
  }
  .dpad::before, .dpad::after {
    content: ""; position: absolute; background: #e9e2d6; border: 1px solid #bdb3a2;
    box-shadow: 0 2px 3px rgba(67,56,43,.2);
  }
  .dpad::before { left: 32px; top: 0; width: 32px; height: 96px; border-radius: 7px; }
  .dpad::after { left: 0; top: 32px; width: 96px; height: 32px; border-radius: 7px; }
  .control-button {
    position: relative; z-index: 2; margin: 0; padding: 0;
    color: #756d60; background: linear-gradient(#fffdf8, #e9e1d5);
    border: 1px solid #bcb2a1; box-shadow: 0 2px 3px rgba(67,56,43,.2);
    cursor: pointer; user-select: none; touch-action: none;
    font: 600 19px/1 -apple-system, "Segoe UI Symbol", "Segoe UI", sans-serif;
  }
  .control-button:hover:not([aria-disabled="true"]) {
    color: #554e45; border-color: #9f9481; background: linear-gradient(#f8f3eb, #ddd3c4);
  }
  .control-button:active:not([aria-disabled="true"]),
  .control-button.pressed {
    color: #433d35; background: #d3c8b8; transform: translateY(1px);
    box-shadow: inset 0 1px 2px rgba(67,56,43,.2);
  }
  .control-button[aria-disabled="true"] {
    color: #b5ac9e; background: #eee9e0; border-color: #d3cabd;
    box-shadow: none; cursor: not-allowed;
  }
  .control-button.error, .target-button.error {
    border-color: var(--red); box-shadow: 0 0 0 1px rgba(200,57,47,.18);
  }
  .control-button::after, .target-button::after {
    content: attr(data-tooltip); position: absolute; left: 50%; bottom: calc(100% + 7px);
    transform: translateX(-50%); width: max-content; max-width: 230px;
    padding: 5px 7px; color: #fffdf8; background: rgba(59,57,52,.94);
    border-radius: 4px; font: 11px/1.3 -apple-system, "Segoe UI", sans-serif;
    white-space: normal; text-align: left; pointer-events: none;
    opacity: 0; visibility: hidden; transition: opacity .1s; z-index: 20;
  }
  .control-button:hover::after, .control-button:focus-visible::after,
  .target-button:hover::after, .target-button:focus-visible::after {
    opacity: 1; visibility: visible;
  }
  .control-right .control-button::after, .control-right .target-button::after {
    left: auto; right: 0; transform: none;
  }
  .control-left .control-button::after, .control-left .target-button::after {
    left: 0; transform: none;
  }
  .dpad .control-button {
    position: absolute; width: 32px; height: 32px; border: 0; background: transparent;
    box-shadow: none; border-radius: 5px; font-size: 13px;
  }
  .dpad .control-button:hover:not([aria-disabled="true"]) { background: rgba(184,173,155,.27); }
  .dpad .control-button.pressed { background: rgba(132,119,101,.28); transform: translateY(1px); }
  .dpad-up { left: 32px; top: 0; }
  .dpad-down { left: 32px; bottom: 0; }
  .dpad-left { left: 0; top: 32px; }
  .dpad-right { right: 0; top: 32px; }
  .dpad-label { position: absolute; color: #4f4a42; font-size: 12px; line-height: 1.05; text-align: center; }
  .label-forward { top: 0; left: 47px; width: 58px; }
  .label-backward { bottom: 0; left: 43px; width: 66px; }
  .label-left { left: -12px; top: 61px; width: 25px; }
  .label-right { right: -5px; top: 61px; width: 31px; }
  .round-button {
    width: 39px; height: 39px; border-radius: 50%; flex: 0 0 39px;
  }
  .observe-wrap {
    margin-top: 16px; display: flex; flex-direction: column; align-items: center;
    gap: 5px; transform: translateX(-7px);
  }
  .observe-wrap .round-button { font-size: 18px; }
  .button-caption { color: #4f4a42; font-size: 12px; line-height: 1.1; text-align: center; }
  .function-grid {
    display: grid; grid-template-columns: 64px 64px; column-gap: 16px; row-gap: 29px;
    align-items: start; justify-content: center; transform: translateX(6px);
  }
  .function-key { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 64px; }
  .function-key .round-button { font-size: 22px; }
  .function-key.gripper .round-button { font-size: 17px; }
  .control-status {
    min-height: 13px; margin-top: auto; padding-top: 7px; color: var(--muted);
    font-size: 10px; line-height: 1; text-transform: capitalize;
  }
  .control-status.error { color: var(--red); }
  .col.right > .col .panel-title { padding: 7px 14px; }
  @media (max-width: 820px) {
    .framewrap {
      grid-template-columns: minmax(150px, .48fr) minmax(230px, 1fr) minmax(150px, .47fr);
    }
    .control-rail { padding-left: 5px; padding-right: 5px; }
    .controls-toggle { width: 145px; }
    .control-right .target-row { gap: 4px; }
    .function-grid { column-gap: 9px; }
  }

  /* timeline */
  #timeline { overflow-y: auto; padding: 6px 0; }
  .step { display: flex; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--border); font-size: 15px; }
  .step:hover { background: var(--panel2); }
  .step.hasclip { cursor: pointer; }
  .step.episode { cursor: pointer; background: rgba(47,111,214,.08); }
  .step.hasclip .idx::after { content: "▶"; color: var(--green); font-size: 10px; margin-left: 4px; }
  .step.episode .idx::after { content: "▶"; color: var(--accent); font-size: 10px; margin-left: 4px; }
  .step .idx { color: var(--muted); width: 30px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .step .body { min-width: 0; flex: 1; }
  .step .act { font-weight: 600; color: var(--accent); }
  .step .det { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .el { color: var(--muted); font-size: 12px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .step.term { background: rgba(47,138,62,.08); }

  /* launcher (start screen) */
  #launcher {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px; overflow-y: auto;
  }
  #launcher.hidden { display: none; }
  .launch-card {
    width: 100%; max-width: 680px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 32px 34px;
    box-shadow: 0 12px 40px rgba(60,50,40,.18);
  }
  .launch-card h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  .launch-card h2 .dot { color: var(--accent); }
  .launch-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .lform { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .lfield { display: flex; flex-direction: column; gap: 6px; }
  .lfield.full { grid-column: 1 / -1; }
  .lfield.hidden { display: none; }
  .lfield label { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .lfield input[type=text], .lfield input[type=number], .lfield select {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 11px; font-size: 15px; width: 100%; max-width: none;
  }
  .lcheck { flex-direction: row; align-items: center; gap: 8px; }
  .lcheck label { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--fg); }
  .launch-actions { display: flex; align-items: center; gap: 14px; margin-top: 24px; }
  #runBtn {
    background: var(--green); color: #07210e; border: none; border-radius: 8px;
    padding: 12px 30px; font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: .3px;
  }
  #runBtn:hover { filter: brightness(1.08); }
  #runBtn:disabled { opacity: .55; cursor: default; }
  #launchStatus { color: var(--muted); font-size: 14px; }
  @media (max-width: 720px), (max-height: 620px) {
    #launcher { padding: 12px; }
    .launch-card { padding: 18px; }
    .lform { grid-template-columns: 1fr; gap: 12px; }
  }

  .empty { color: var(--muted); padding: 24px 14px; font-style: italic; font-size: 14px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #c9bea9; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <div id="launcher" class="hidden">
    <div class="launch-card">
      <h2><span class="dot">●</span> RPent · New Run</h2>
      <div class="sub">Review the config, then click Run to start the agent.</div>
      <div class="lform">
        <div class="lfield full">
          <label for="f-suite">Suite</label>
          <select id="f-suite">
            <option value="libero_object_task">libero_object_task</option>
            <option value="libero_object_swap">libero_object_swap</option>
            <option value="libero_object_lan">libero_object_lan</option>
            <option value="libero_goal_task">libero_goal_task</option>
            <option value="libero_goal_swap">libero_goal_swap</option>
            <option value="libero_goal_lan">libero_goal_lan</option>
            <option value="libero_spatial_task">libero_spatial_task</option>
            <option value="libero_spatial_swap">libero_spatial_swap</option>
            <option value="libero_spatial_lan">libero_spatial_lan</option>
            <option value="libero_10">libero_10</option>
            <option value="libero_10_task">libero_10_task</option>
            <option value="libero_10_swap">libero_10_swap</option>
            <option value="libero_10_lan">libero_10_lan</option>
          </select>
        </div>
        <div class="lfield">
          <label for="f-task">Task</label>
          <input type="number" id="f-task" min="0" step="1" />
        </div>
        <div class="lfield">
          <label for="f-seed">Seed</label>
          <input type="number" id="f-seed" min="0" step="1" />
        </div>
        <div class="lfield">
          <label for="f-planner">Planner (LLM backend)</label>
          <select id="f-planner">
            <option value="api">api</option>
            <option value="claude_code">claude_code</option>
            <option value="codex">codex</option>
          </select>
        </div>
        <div class="lfield">
          <label for="f-max-turns">Max turns</label>
          <input type="number" id="f-max-turns" min="1" step="1" />
        </div>
        <div class="lfield backend-field" data-backends="api">
          <label for="f-max-tokens">Max tokens</label>
          <input type="number" id="f-max-tokens" min="1" step="1" />
        </div>
        <div class="lfield">
          <label for="f-max-episode-steps">Max episode steps</label>
          <input type="number" id="f-max-episode-steps" min="1" step="1" />
        </div>
        <div class="lfield backend-field full" data-backends="api claude_code codex">
          <label for="f-model_preset">Model preset</label>
          <select id="f-model_preset"></select>
        </div>
        <div class="lfield backend-field full" data-backends="api claude_code codex">
          <label for="f-model_custom">Custom model <span style="text-transform:none">(optional)</span></label>
          <input type="text" id="f-model_custom" placeholder="provider:model or alias" />
        </div>
        <div class="lfield backend-field" data-backends="claude_code">
          <label for="f-claude-code-max-budget-usd">Claude Code budget USD</label>

<script>
const $ = (s) => document.querySelector(s);
let curRun = null, evShown = 0, frameKind = "agent", es = null, frameIdx = -1;
let actionVideo = null;
let episodeVideoAvailable = false;
let lastRealtimeFrameKind = "agent";
let autoActionLastStep = 0;
let autoActionPrimed = false;
let autoActionPlayback = null;
let autoActionReturnTimer = null;
let stepTransitioning = false;  // suppress realtime frames during step transition
let controlsExpanded = true;
let selectedTarget = "chassis";
let selectedCamera = "head";
let pressedAction = null;
let activeLeaseId = null;
let controlStatus = "idle";
let behaviorControlsEnabled = false;
let controlSnapshot = { available: false, busy: false, owner: null, phase: "idle" };
let controlSequence = 0;
let activeControlButton = null;
let activePointerId = null;
let repeatArmed = false;
let repeatTimer = null;
let heartbeatTimer = null;
let controlLoopGeneration = 0;
let lastCommandSubmittedAt = 0;
let controlErrorTimer = null;
let controlCommandInFlight = false;
let controlPollAbort = null;
const AUTO_ACTION_RETURN_DELAY_MS = 300;
const CONTROL_HOLD_DELAY_MS = 320;
const CONTROL_REPEAT_MIN_MS = 220;
const CONTROL_HEARTBEAT_MS = 400;
const CONTROL_POLL_MS = 100;
const CONTROL_COMMAND_TIMEOUT_MS = 245000;
const PHYSICAL_CAMERAS = new Set(["head", "left_wrist", "right_wrist"]);
const REPEATABLE_ACTIONS = new Set([
  "forward", "backward", "turn_left", "turn_right",
  "up", "down", "rotate_left", "rotate_right",
]);
const MODEL_PRESETS = {
  api: [
    "",
    "anthropic:claude-opus-4-7",
    "anthropic:claude-opus-4-8",
    "anthropic:claude-sonnet-4-5",
    "openai:gpt-5.5",
    "openai-chat:glm-5.2",
  ],
  claude_code: ["", "claude-opus-4-7", "sonnet", "opus"],
  codex: [""],
};

// --- Double-buffered media swap ------------------------------------------
// Two <img> + two <video> live in the DOM at the same position. Exactly one
// carries the `.visible` class at any moment. When switching to new media
// (new realtime frame URL, new tab, new video), we PRE-LOAD into the OTHER
// buffer and only toggle `.visible` after `load` (img) / `canplay` (video)
// fires. Result: no black flash, because the previously-visible element
// stays painted the whole time the new one is loading.
const imgA = () => $("#frame-a");
const imgB = () => $("#frame-b");
const vidA = () => $("#video-a");
const vidB = () => $("#video-b");
let activeImg = null;   // whichever of imgA/imgB is currently .visible
let activeVideo = null; // whichever of vidA/vidB is currently .visible

function cancelAutoActionReturn() {
  if (autoActionReturnTimer) {
    clearTimeout(autoActionReturnTimer);
    autoActionReturnTimer = null;
  }
}

function _bufferPair(kind) {
  return kind === "img" ? [imgA(), imgB()] : [vidA(), vidB()];
}

function _pickTarget(kind, url) {
  const [a, b] = _bufferPair(kind);
  if (a._loadedSrc === url) return a;
  if (b._loadedSrc === url) return b;
  const active = kind === "img" ? activeImg : activeVideo;
  return a === active ? b : a;
}

function _showBuffer(el) {
  for (const m of document.querySelectorAll(".frame-media.visible")) {
    if (m !== el) m.classList.remove("visible");
  }
  el.classList.add("visible");
  if (el.tagName === "IMG") activeImg = el;
  else activeVideo = el;
  // Whenever we settle on new visible media, pause the *other* video so it
  // doesn't keep playing audio underneath (matters most on video → img
  // auto-return; browsers hidden via visibility keep playing by default).
  for (const v of [vidA(), vidB()]) {
    if (v !== el && !v.paused) { try { v.pause(); } catch {} }
  }
}

// --- Sequential media swap queue ------------------------------------------
// Every swap runs to completion (image `load` or video `canplay`) before
// the next one starts, so the previously-visible element stays painted
// until the new one is decoded — no black flash.
//
// Realtime frames pushed by SSE while a swap is in flight are queued in
// order, never dropped or interrupted, so switching tabs and rolling
// updates do not cut each other short.
//
// Videos may hold the queue until they finish playing (`holdUntilEnded`),
// preventing realtime frame updates from cutting a video short.
// `source: "user"` on a spec (tab click, manual step replay, click on
// episode) drops pending "auto" specs and releases any current hold so
// user actions stay responsive — the currently-visible element is not
// interrupted, but its hold is released as soon as the click arrives.
const swapQueue = [];
let swapInFlight = false;
let releaseHold = null;   // release the current holdUntilEnded, if any
let inflightGen = 0;      // bump to invalidate the in-flight swap

function swapMedia(spec) {
  if (spec.source === "user") {
    for (let i = swapQueue.length - 1; i >= 0; i--) {
      if (swapQueue[i].source !== "user") swapQueue.splice(i, 1);
    }
    if (releaseHold) {
      // Currently held on a video's end — release it so the click
      // doesn't wait through the rest of the clip. Call `releaseHold`
      // DIRECTLY (don't null it before the call): `release` itself
      // guards against double-release by checking `releaseHold !== release`
      // and nulls the global on entry. If we nulled it here first, that
      // guard would trip on the very first invocation and `done()` would
      // never fire → the queue would wedge with swapInFlight stuck true
      // and no further click would take effect.
      releaseHold();
    } else if (swapInFlight) {
      // An auto swap is still loading (finish hasn't run yet, so there's
      // no hold to release). Abandon it: bumping `inflightGen` makes the
      // in-flight swap's finish + done no-op when they eventually fire,
      // so the click's spec can start immediately without waiting for
      // the abandoned fetch to complete.
      inflightGen++;
      swapInFlight = false;
    }
  }
  swapQueue.push(spec);
  _pumpSwap();
}

function _pumpSwap() {
  if (swapInFlight || !swapQueue.length) return;
  const spec = swapQueue.shift();
  swapInFlight = true;
  const gen = ++inflightGen;
  _runSwap(spec, gen, () => {
    if (gen !== inflightGen) return;   // abandoned — skip queue advancement
    swapInFlight = false;
    _pumpSwap();
  });
}

function _runSwap({ kind, url, cap, onReady, holdUntilEnded }, gen, done) {
  const target = _pickTarget(kind, url);
  let finished = false;
  let fallbackTimer = null;

  const finish = (ok) => {
    if (finished) return;
    finished = true;
    if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
    if (gen !== inflightGen) return;   // abandoned — don't paint or advance
    target._loadedSrc = ok ? url : null;
    _showBuffer(target);
    if (cap != null) $("#frameCap").textContent = cap;
    if (onReady) onReady(target);
    if (holdUntilEnded && kind === "video") {
      // Realtime frames wait on this video until it ends (natural or errored)
      // — or until a user action releases the hold via `swapMedia`.
      const release = () => {
        if (releaseHold !== release) return;
        releaseHold = null;
        target.removeEventListener("ended", release);
        target.removeEventListener("error", release);
        done();
      };
      releaseHold = release;
      target.addEventListener("ended", release, { once: true });
      target.addEventListener("error", release, { once: true });
    } else {
      done();
    }
  };

  // Fast path: URL already resident on this buffer (e.g. user replays the
  // same action video — no re-fetch, just play from cache).
  if (target._loadedSrc === url) {
    finish(true);
    return;
  }

  _clearMediaListeners(target);
  // Once we start loading a new URL into this buffer, its cached identity is
  // stale — clear it so an abandoned load can't leave `_loadedSrc` pointing
  // at content the buffer no longer actually holds.
  target._loadedSrc = null;
  if (kind === "img") {
    const onload = () => finish(true);
    const onerror = () => finish(false);
    target.addEventListener("load", onload, { once: true });
    target.addEventListener("error", onerror, { once: true });
    target._swapCleanup = () => {
      target.removeEventListener("load", onload);
      target.removeEventListener("error", onerror);
    };
    target.src = url;
  } else {
    // `{ once: true }` on `canplay` is CRITICAL: without it, the event
    // refires every time the video buffers or seeks, and running `onReady`
    // more than once resets `currentTime = 0` in a loop → the video would
    // stall at frame 0 and never actually play.
    const oncan = () => finish(true);
    const onerr = () => finish(false);
    target.addEventListener("canplay", oncan, { once: true });
    target.addEventListener("error", onerr, { once: true });
    target._swapCleanup = () => {
      target.removeEventListener("canplay", oncan);
      target.removeEventListener("error", onerr);
    };
    target.src = url;
    target.load();
  }

  // Fallback: if load/canplay never fires (network stall, missing keyframe),
  // swap anyway after 4s so the queue does not wedge on one bad fetch.
  fallbackTimer = setTimeout(() => finish(true), 4000);
}

function _clearMediaListeners(el) {
  if (el._swapCleanup) { el._swapCleanup(); el._swapCleanup = null; }
}

function resetAllMedia() {
  // Full reset — only used when selecting a new run. Drops the queue,
  // invalidates any in-flight swap (via inflightGen), releases any
  // pending hold, and wipes both buffers.
  swapQueue.length = 0;
  inflightGen++;
  if (releaseHold) releaseHold();
  swapInFlight = false;
  for (const el of [imgA(), imgB()]) {
    el.classList.remove("visible");
    _clearMediaListeners(el);
    el.removeAttribute("src");
    el._loadedSrc = null;
  }
  for (const v of [vidA(), vidB()]) {
    v.classList.remove("visible");
    _clearMediaListeners(v);
    v.onended = null; v.muted = false;
    try { v.pause(); } catch {}
    v.removeAttribute("src");
    v.load();
    v._loadedSrc = null;
  }
  activeImg = null;
  activeVideo = null;
}

// --- BEHAVIOR interactive controls ---------------------------------------
// The browser sends semantic actions only. Distances, angles, poses and
// gripper openings remain server-owned safety constants.
const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

function isRealtimeFrameKind(kind) {
  return kind === "agent" || kind === "camera" || PHYSICAL_CAMERAS.has(kind);
}

function makeLeaseId() {
  if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
    return globalThis.crypto.randomUUID();
  }
  return `manual-${Date.now()}-${Math.random().toString(36).slice(2)}`;
}

function isBehaviorRun(meta) {
  const identity = `${meta?.suite || ""} ${meta?.name || ""}`.toLowerCase();
  return identity.includes("behavior") || identity.includes("omnigibson");
}

function controlTooltip(action) {
  if (action === "observe") return "Refresh the currently selected camera view.";
  if (action === "open") return "Open the selected gripper and keep it open.";
  if (action === "close") return "Close the selected gripper and maintain gripping pressure.";
  if (selectedTarget === "chassis") {
    const tips = {
      forward: "Move the chassis forward by 5 cm. Hold to continue.",
      backward: "Move the chassis backward by 5 cm. Hold to continue.",
      turn_left: "Rotate the chassis left by 5°. Hold to continue.",
      turn_right: "Rotate the chassis right by 5°. Hold to continue.",
      up: "Raise the R1Pro body by 3 cm. Hold to continue.",
      down: "Lower the R1Pro body by 3 cm. Hold to continue.",
    };
    return tips[action] || "Available for arm control only.";
  }
  const hand = selectedTarget === "left_arm" ? "left" : "right";
  const tips = {
    forward: `Move the ${hand} hand forward by 3 cm. Hold to continue.`,
    backward: `Move the ${hand} hand backward by 3 cm. Hold to continue.`,
    turn_left: `Move the ${hand} hand 3 cm to the robot’s left. Hold to continue.`,
    turn_right: `Move the ${hand} hand 3 cm to the robot’s right. Hold to continue.`,
    up: `Move the ${hand} hand up by 3 cm. Hold to continue.`,
    down: `Move the ${hand} hand down by 3 cm. Hold to continue.`,
    rotate_left: "Rotate the selected wrist 5° clockwise. Hold to continue.",
    rotate_right: "Rotate the selected wrist 5° counterclockwise. Hold to continue.",
  };
  return tips[action] || "";
}

function actionCapability(action) {
  if (action === "observe") return { available: true, reason: "" };
  const capabilities = controlSnapshot.capabilities;
  if (!capabilities || typeof capabilities !== "object") {
    return {
      available: false,
      reason: "Control unavailable until its safety capability is verified.",
    };
  }
  if (selectedTarget === "chassis") {
    if (["forward", "backward", "turn_left", "turn_right"].includes(action)) {
      return {
        available: capabilities.base_available === true,
        reason: "Base control unavailable.",
      };
    }
    if (["up", "down"].includes(action)) {
      return {
        available: capabilities.torso_available === true,
        reason: "Torso control unsupported.",
      };
    }
    return { available: false, reason: "Available for arm control only." };
  }
  const hand = selectedTarget === "left_arm" ? "left" : "right";
  if (["forward", "backward", "turn_left", "turn_right", "up", "down"].includes(action)) {
    return {
      available: capabilities.eef_available?.[hand] === true,
      reason: `The ${hand} arm control capability is unavailable.`,
    };
  }
  if (["rotate_left", "rotate_right"].includes(action)) {
    return {
      available: capabilities.wrist_rotation_available?.[hand] === true,
      reason: `The ${hand} wrist rotation capability is unavailable.`,
    };
  }
  if (["open", "close"].includes(action)) {
    return {
      available: capabilities.gripper_available?.[hand] === true,
      reason: `The ${hand} gripper control capability is unavailable.`,
    };
  }
  return { available: false, reason: "Control capability unavailable." };
}

function setBehaviorControlMode(enabled) {
  behaviorControlsEnabled = !!enabled;
  const wrap = $("#framewrap");
  wrap.classList.toggle("behavior-mode", behaviorControlsEnabled);
  wrap.classList.toggle("controls-collapsed", behaviorControlsEnabled && !controlsExpanded);
  if (!behaviorControlsEnabled) {
    controlSnapshot = { available: false, busy: false, owner: null, phase: "idle" };
    controlStatus = "idle";
  }
  renderControlUI();
}

function renderControlUI() {
  const wrap = $("#framewrap");
  wrap.classList.toggle("controls-collapsed", behaviorControlsEnabled && !controlsExpanded);
  document.querySelectorAll(".controls-toggle").forEach(button => {
    button.setAttribute("aria-expanded", String(controlsExpanded));
  });
  document.querySelectorAll(".target-button").forEach(button => {
    const selected = button.dataset.target === selectedTarget;
    button.classList.toggle("selected", selected);
    button.setAttribute("aria-pressed", String(selected));
    button.dataset.tooltip = button.dataset.error || `Control the ${button.textContent.trim().toLowerCase()}.`;
  });

  const locallyBusy = controlCommandInFlight ||
    ["planning", "moving", "stopping"].includes(controlStatus);
  const backendBusy = !!controlSnapshot.busy;
  const busy = locallyBusy || backendBusy;
  const available = behaviorControlsEnabled && controlSnapshot.available !== false;
  const motionAvailable = available &&
    (controlSnapshot.motion_available ?? controlSnapshot.available) === true;
  document.querySelectorAll(".control-button").forEach(button => {
    const action = button.dataset.action;
    const armOnly = selectedTarget === "chassis" &&
      ["rotate_left", "rotate_right", "open", "close"].includes(action);
    const capability = actionCapability(action);
    const observeAvailable = available &&
      (controlSnapshot.observe_available ?? controlSnapshot.available) === true;
    const capabilityAvailable = action === "observe"
      ? observeAvailable
      : motionAvailable && capability.available;
    const isCurrent = button === activeControlButton && pressedAction === action;
    const disabled = armOnly || !capabilityAvailable || (busy && !isCurrent);
    button.setAttribute("aria-disabled", String(disabled));
    button.dataset.tooltip = button.dataset.error ||
      (armOnly
        ? "Available for arm control only."
        : !capabilityAvailable && action !== "observe"
          ? capability.reason
          : controlTooltip(action));
    button.title = button.dataset.tooltip;
  });
  document.querySelectorAll(".target-button").forEach(button => {
    // Target changes are themselves a stop condition: keep them selectable
    // while a manual lease is active so the handler can stop first, then
    // change target. They remain unavailable only when control is unavailable.
    button.setAttribute("aria-disabled", String(!available));
  });

  const phase = controlStatus === "idle"
    ? (controlSnapshot.phase || "idle")
    : controlStatus;
  document.querySelectorAll(".control-status").forEach((el, index) => {
    el.textContent = index === 0 && phase !== "idle" ? phase : "";
    el.classList.toggle("error", phase === "error" || phase === "failed");
  });
}

function showControlError(error, button = activeControlButton) {
  const message = typeof error === "string"
    ? error
    : (error?.detail || error?.error || error?.message || "Manual control failed.");
  controlStatus = "error";
  const target = button || activeControlButton;
  if (target) {
    target.dataset.error = String(message);
    target.classList.add("error");
  }
  if (controlErrorTimer) clearTimeout(controlErrorTimer);
  controlErrorTimer = setTimeout(() => {
    document.querySelectorAll(".control-button.error, .target-button.error").forEach(el => {
      el.classList.remove("error");
      delete el.dataset.error;
    });
    if (controlStatus === "error") controlStatus = "idle";
    renderControlUI();
  }, 2400);
  renderControlUI();
}

function applyControlSnapshot(snapshot) {
  if (!snapshot || typeof snapshot !== "object") return;
  const next = snapshot.control && typeof snapshot.control === "object"
    ? snapshot.control : snapshot;
  controlSnapshot = { ...controlSnapshot, ...next };
  const phase = next.phase;
  if (phase === "accepted" || phase === "planning") controlStatus = "planning";
  else if (phase === "moving") controlStatus = "moving";
  else if (phase === "stopping") controlStatus = "stopping";
  else if (phase === "completed" || phase === "cancelled" || phase === "idle") {
    controlStatus = "idle";
  } else if (phase === "failed") {
    showControlError(next.error || "Manual control failed.");
    return;
  }
  renderControlUI();
}

async function controlRequest(path, body = null, method = "POST", signal = null) {
  const options = { method, headers: { "Content-Type": "application/json" } };
  if (body != null) options.body = JSON.stringify(body);
  if (signal) options.signal = signal;
  const response = await fetch(path, options);
  let data = {};
  try { data = await response.json(); } catch {
    try { data = { detail: await response.text() }; } catch {}
  }
  if (!response.ok) {
    const error = new Error(data.detail || data.error || `Control request failed (${response.status}).`);
    error.status = response.status;
    error.payload = data;
    throw error;
  }
  return data;
}

async function refreshControlState() {
  if (!curRun || !behaviorControlsEnabled) return null;
  try {
    const data = await controlRequest(
      `/api/run/control/state?run=${encodeURIComponent(curRun)}`, null, "GET");
    applyControlSnapshot(data);
    return data;
  } catch (error) {
    controlSnapshot = { ...controlSnapshot, available: false, busy: false };
    renderControlUI();
    return null;
  }
}

function clearControlTimers() {
  if (repeatTimer) { clearTimeout(repeatTimer); repeatTimer = null; }
  if (heartbeatTimer) { clearTimeout(heartbeatTimer); heartbeatTimer = null; }
}

function scheduleHeartbeat(leaseId, runId) {
  if (heartbeatTimer) clearTimeout(heartbeatTimer);
  heartbeatTimer = setTimeout(async () => {
    if (activeLeaseId !== leaseId || curRun !== runId) return;
    try {
      await controlRequest("/api/run/control/heartbeat", {
        run: runId, lease_id: leaseId,
      });
    } catch (error) {
      showControlError(error);
      await stopActiveLease("heartbeat_failed");
      return;
    }
    scheduleHeartbeat(leaseId, runId);
  }, CONTROL_HEARTBEAT_MS);
}

async function waitForCommand(commandId, runId, generation, signal) {
  const deadline = performance.now() + CONTROL_COMMAND_TIMEOUT_MS;
  while (performance.now() < deadline) {
    if (generation !== controlLoopGeneration || runId !== curRun) {
      return { phase: "cancelled", stop_reason: "client_stopped" };
    }
    const data = await controlRequest(
      `/api/run/control/state?run=${encodeURIComponent(runId)}`, null, "GET", signal);
    const state = data.control && typeof data.control === "object" ? data.control : data;
    applyControlSnapshot(state);
    // Never attribute a stale/global terminal phase to this command. The
    // command id is the completion receipt that closes the single-flight
    // loop; without an exact match, keep waiting.
    if (
      state.command_id === commandId &&
      ["completed", "failed", "cancelled"].includes(state.phase)
    ) return state;
    await sleep(CONTROL_POLL_MS);
  }
  throw new Error("Manual control command timed out.");
}

async function submitDiscreteAction(leaseId, runId, action, camera, generation) {
  controlCommandInFlight = true;
  controlStatus = "planning";
  renderControlUI();
  const sequence = ++controlSequence;
  lastCommandSubmittedAt = performance.now();
  try {
    const accepted = await controlRequest("/api/run/control/command", {
      run: runId,
      lease_id: leaseId,
      sequence,
      target: selectedTarget,
      action,
      camera,
    });
    const commandId = accepted.command_id || accepted.control?.command_id;
    if (!commandId) throw new Error("Control command was accepted without a command ID.");
    if (generation !== controlLoopGeneration || activeLeaseId !== leaseId) {
      // Release may race the initial POST. Stop again after acceptance so a
      // stop that arrived before the server created the lease cannot leave a
      // live lease behind.
      try {
        await controlRequest("/api/run/control/stop", {
          run: runId, lease_id: leaseId, reason: "released_after_accept",
        });
      } catch {}
      throw new DOMException("Control wait aborted.", "AbortError");
    }
    const pollAbort = new AbortController();
    controlPollAbort = pollAbort;
    const terminal = ["completed", "failed", "cancelled"].includes(accepted.phase)
      ? accepted
      : await waitForCommand(commandId, runId, generation, pollAbort.signal);
    if (terminal.capture_error || terminal.error) {
      throw new Error(terminal.capture_error || terminal.error);
    }
    if (terminal.phase !== "completed") {
      throw new Error(terminal.error || terminal.stop_reason || `Control command ${terminal.phase}.`);
    }
    return terminal;
  } finally {
    controlPollAbort = null;
    controlCommandInFlight = false;
    renderControlUI();
  }
}

async function runControlLoop(button, leaseId, runId, action, camera, generation) {
  const repeatable = REPEATABLE_ACTIONS.has(action);
  try {
    while (activeLeaseId === leaseId && generation === controlLoopGeneration) {
      await submitDiscreteAction(leaseId, runId, action, camera, generation);
      if (!repeatable) break;
      // A repeat may only be admitted after the hold gate opens. Polling
      // this local flag does not submit or queue backend work; it only keeps
      // the single loop dormant until the 320 ms timer has fired.
      while (
        activeLeaseId === leaseId && generation === controlLoopGeneration &&
        pressedAction === action && !repeatArmed
      ) await sleep(16);
      if (
        activeLeaseId !== leaseId || generation !== controlLoopGeneration ||
        pressedAction !== action || !repeatArmed
      ) break;
      const elapsedSinceSubmit = performance.now() - lastCommandSubmittedAt;
      if (elapsedSinceSubmit < CONTROL_REPEAT_MIN_MS) {
        await sleep(CONTROL_REPEAT_MIN_MS - elapsedSinceSubmit);
      }
    }
  } catch (error) {
    if (activeLeaseId === leaseId) {
      showControlError(error, button);
      await stopActiveLease("command_failed");
    }
  } finally {
    if (activeLeaseId === leaseId && !repeatable) {
      clearControlTimers();
      activeLeaseId = null;
      controlStatus = "idle";
    }
    renderControlUI();
  }
}

function beginControlAction(button, pointerId = "keyboard") {
  const action = button.dataset.action;
  if (
    pressedAction || activeLeaseId || !behaviorControlsEnabled ||
    button.getAttribute("aria-disabled") === "true"
  ) return;
  const runId = curRun;
  if (!runId) return;
  pressedAction = action;
  activeControlButton = button;
  activePointerId = pointerId;
  repeatArmed = false;
  button.classList.add("pressed");
  const leaseId = makeLeaseId();
  activeLeaseId = leaseId;
  controlSequence = 0;
  const generation = ++controlLoopGeneration;
  const leaseCamera = selectedCamera;
  scheduleHeartbeat(leaseId, runId);
  if (REPEATABLE_ACTIONS.has(action)) {
    repeatTimer = setTimeout(() => {
      if (activeLeaseId === leaseId && pressedAction === action) repeatArmed = true;
    }, CONTROL_HOLD_DELAY_MS);
  }
  runControlLoop(button, leaseId, runId, action, leaseCamera, generation);
  renderControlUI();
}

async function endControlPress(pointerId = activePointerId) {
  if (activePointerId !== pointerId || !pressedAction) return;
  const action = pressedAction;
  const button = activeControlButton;
  pressedAction = null;
  activePointerId = null;
  repeatArmed = false;
  if (repeatTimer) { clearTimeout(repeatTimer); repeatTimer = null; }
  if (button) button.classList.remove("pressed");
  activeControlButton = null;
  if (REPEATABLE_ACTIONS.has(action)) await stopActiveLease("released");
  renderControlUI();
}

async function stopActiveLease(reason = "client_stop") {
  const leaseId = activeLeaseId;
  const runId = curRun;
  clearControlTimers();
  if (controlPollAbort) {
    controlPollAbort.abort();
    controlPollAbort = null;
  }
  controlLoopGeneration++;
  activeLeaseId = null;
  repeatArmed = false;
  pressedAction = null;
  activePointerId = null;
  if (activeControlButton) activeControlButton.classList.remove("pressed");
  activeControlButton = null;
  if (!leaseId || !runId) {
    controlStatus = "idle";
    renderControlUI();
    return;
  }
  controlStatus = "stopping";
  renderControlUI();
  try {
    await controlRequest("/api/run/control/stop", {
      run: runId, lease_id: leaseId, reason,
    });
  } catch (error) {
    // A completed/expired lease is already stopped. Surface other failures.
    if (![404, 409, 410].includes(error.status)) showControlError(error);
  } finally {
    if (controlStatus === "stopping") controlStatus = "idle";
    renderControlUI();
  }
}

async function setControlsExpanded(expanded) {
  if (!expanded) await stopActiveLease("controls_collapsed");
  controlsExpanded = !!expanded;
  renderControlUI();
}

async function selectControlTarget(target) {
  if (target === selectedTarget) return;
  await stopActiveLease("target_changed");
  selectedTarget = target;
  renderControlUI();
}

async function publishSelectedCamera(camera) {
  if (!curRun || !behaviorControlsEnabled) return;
  try {
    await controlRequest("/api/run/control/camera", { run: curRun, camera });
  } catch (error) {
    showControlError(error);
  }
}

document.querySelectorAll(".controls-toggle").forEach(button => {
  button.addEventListener("click", () => setControlsExpanded(!controlsExpanded));
});
document.querySelectorAll(".target-button").forEach(button => {
  button.addEventListener("click", () => {
    if (button.getAttribute("aria-disabled") !== "true") {
      selectControlTarget(button.dataset.target);
    }
  });
});
document.querySelectorAll(".control-button").forEach(button => {
  button.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    event.preventDefault();
    try { button.setPointerCapture(event.pointerId); } catch {}
    beginControlAction(button, event.pointerId);
  });
  button.addEventListener("pointerup", event => {
    event.preventDefault();
    endControlPress(event.pointerId);
    try { button.releasePointerCapture(event.pointerId); } catch {}
  });
  button.addEventListener("pointercancel", event => endControlPress(event.pointerId));
  button.addEventListener("lostpointercapture", event => endControlPress(event.pointerId));
  button.addEventListener("keydown", event => {
    if (![" ", "Enter"].includes(event.key) || event.repeat) return;
    event.preventDefault();
    beginControlAction(button, "keyboard");
  });
  button.addEventListener("keyup", event => {
    if (![" ", "Enter"].includes(event.key)) return;
    event.preventDefault();
    endControlPress("keyboard");
  });
});
window.addEventListener("blur", () => stopActiveLease("window_blur"));
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopActiveLease("page_hidden");
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    event.preventDefault();
    stopActiveLease("escape");
  }
});
renderControlUI();

function fmtArgs(o) {
  if (o == null) return "";
  if (typeof o === "string") return o;
  try { return JSON.stringify(o); } catch { return String(o); }
}

async function loadRun() {
  const r = await fetch("/api/runs").then(x => x.json());
  if (!r.runs.length) {
    $("#taskMeta").textContent = `(no runs in ${r.runs_dir})`;
    return;
  }

  const run = r.runs[0];
  selectRun(run.id);
}

function setBadge(state) {
  const b = $("#statusBadge");
  b.className = "badge b-" + (state || "stale");
  b.textContent = state || "—";
}

function setResult(terminated, state) {
  const b = $("#resultBadge");
  if (state === "done" || terminated) {
    b.style.display = "";
    b.className = "badge " + (terminated ? "b-ok" : "b-fail");
    b.textContent = terminated ? "TASK SOLVED" : "not solved";
  } else {
    b.style.display = "none";
  }
}

function maxTimelineStep(tl) {
  if (!Array.isArray(tl) || !tl.length) return 0;
  return tl.reduce((m, s) => Math.max(m, Number(s.step) || 0), 0);
}

function maybeAutoPlayNewAction(tl, nextFrameIdx) {
  if (!Array.isArray(tl)) return false;
  const candidates = tl.filter(s =>
    s.has_action_video && (Number(s.step) || 0) > autoActionLastStep);
  autoActionLastStep = Math.max(autoActionLastStep, maxTimelineStep(tl));
  const step = candidates[candidates.length - 1];
  if (!step || !isRealtimeFrameKind(frameKind)) return false;
  return playActionVideo(step, {
    auto: true,
    nextFrameIdx,
    returnKind: frameKind,
  });
}

function renderToolContractMeta(metadata) {
  const el = $("#toolContractMeta");
  const count = Number(metadata?.["public-tool-count"]);
  const rawVersion = metadata?.["public-tool-contract-version"];
  const version = rawVersion == null
    ? ""
    : String(rawVersion).trim().replace(/^v/i, "");
  if (
    !behaviorControlsEnabled || !Number.isInteger(count) || count < 0 || !version
  ) {
    el.textContent = "";
    return;
  }
  el.textContent = `${count} primitives · contract v${version}`;
}

function renderTimeline(tl, hasEpisodeVideo = episodeVideoAvailable) {
  tl = Array.isArray(tl) ? tl : [];
  episodeVideoAvailable = !!hasEpisodeVideo;
  const el = $("#timeline");
  const total = tl.length + (episodeVideoAvailable ? 1 : 0);
  $("#stepCount").textContent = total ? total : "";
  if (!tl.length && !episodeVideoAvailable) {
    el.innerHTML = '<div class="empty">No actions yet.</div>';
    return;
  }
  el.innerHTML = "";
  for (const s of tl) {
    if (s.step === 0 && !s.action) continue;
    const div = document.createElement("div");
    div.className = "step" + (s.terminated ? " term" : "");
    if (s.has_action_video) div.className += " hasclip";
    const res = s.result || {};
    let det = "";
    if (res.final_dist_m != null) det += `dist ${(+res.final_dist_m).toFixed(3)}m `;
    if (res.steps_used != null) det += `${res.steps_used}/${res.max_steps ?? "?"} steps `;
    if (res.lifted != null) det += `lifted=${res.lifted} `;
    if (res.chunks != null) det += `chunks=${res.chunks} `;
    det = det.trim() || fmtArgs(s.args).slice(0, 60);
    div.innerHTML = `<span class="idx">${s.step}</span>
      <div class="body"><span class="act">${s.action ?? "—"}</span>
      <div class="det" title="${fmtArgs(res).replace(/"/g,'&quot;')}">${det}</div></div>
      <span class="el">${s.elapsed_s != null ? s.elapsed_s + "s" : ""}</span>`;
    if (s.has_action_video) {
      div.title = "Click to replay this action";
      div.addEventListener("click", () => playActionVideo(s, {
        returnAfterEnd: true,
        returnKind: lastRealtimeFrameKind,
      }));
    }
    el.appendChild(div);
  }
  if (episodeVideoAvailable) {
    const div = document.createElement("div");
    div.className = "step episode";
    div.title = "Click to replay the full episode";
    div.innerHTML = `<span class="idx">full</span>
      <div class="body"><span class="act">episode video</span>
      <div class="det">complete run video</div></div>
      <span class="el">finished</span>`;
    div.addEventListener("click", playEpisodeVideo);
    el.appendChild(div);
  }
}

let curToolGroup = null;

function makeToolEl(ev) {
  const div = document.createElement("div");
  div.className = "ev " + ev.type;
  if (ev.type === "tool_call") {
    div.innerHTML = `→ <span class="tname">${ev.tool}</span> <span class="args"></span>`;
    div.querySelector(".args").textContent = fmtArgs(ev.args);
  } else {
    const isErr = ev.result && ev.result.is_error;
    div.innerHTML = `← <span class="tname ${isErr ? "err" : ""}">${ev.tool}</span> <span class="args"></span>`;
    div.querySelector(".args").textContent = fmtArgs(ev.result);
  }
  return div;
}

function makeThinkingEl(ev) {
  const div = document.createElement("div");
  div.className = "ev thinking";
  const details = document.createElement("details");
  const summary = document.createElement("summary");
  const text = ev.text || "";
  summary.textContent = `thinking · ${text.length.toLocaleString()} chars`;
  const pre = document.createElement("pre");
  pre.textContent = text;
  details.appendChild(summary);
  details.appendChild(pre);
  div.appendChild(details);
  return div;
}

function appendEvents(events) {
  const box = $("#transcript");
  if (evShown === 0) { box.innerHTML = ""; curToolGroup = null; }
  for (const ev of events) {
    if (ev.type === "tool_call" || ev.type === "tool_result") {
      // collapse consecutive tool calls/results into one foldable group
      if (!curToolGroup) {
        const g = document.createElement("div");
        g.className = "toolgroup";
        g.innerHTML = `<div class="tg-head"><span class="tg-count">0</span> tool calls</div><div class="tg-body"></div>`;
        g.querySelector(".tg-head").addEventListener("click", () => g.classList.toggle("open"));
        box.appendChild(g);
        curToolGroup = g;
      }
      curToolGroup.querySelector(".tg-body").appendChild(makeToolEl(ev));
      const n = curToolGroup.querySelectorAll(".tg-body .ev.tool_call").length;
      curToolGroup.querySelector(".tg-count").textContent = n;
    } else {
      curToolGroup = null;  // close the group; turn/text render at top level
      if (ev.type === "thinking") {
        box.appendChild(makeThinkingEl(ev));
      } else {
        const div = document.createElement("div");
        div.className = "ev " + ev.type;
        if (ev.type === "meta") div.textContent = `[${ev.tag}] ${ev.text}`;
        else div.textContent = ev.text;
        box.appendChild(div);
      }
    }
  }
  evShown += events.length;
  $("#evCount").textContent = evShown ? evShown + " events" : "";
  if ($("#autoscroll").checked) box.scrollTop = box.scrollHeight;
}

let txInflight = false, txAgain = false;
async function refreshTranscript() {
  if (!curRun) return;
  // Serialize: only one fetch in flight at a time. Concurrent triggers
  // (selectRun + SSE ticks) would otherwise read the same `evShown`, fetch
  // overlapping chunks, and append in nondeterministic resolution order —
  // which is what made turns show up out of order / duplicated.
  if (txInflight) { txAgain = true; return; }
  txInflight = true;
  const run = curRun;
  try {
    const r = await fetch(
      `/api/run/transcript?run=${encodeURIComponent(run)}&since=${evShown}`
    ).then(x => x.json());
    if (run !== curRun) return;            // switched run mid-flight — drop
    if (r.events && r.events.length) appendEvents(r.events);
    else if (evShown === 0) $("#transcript").innerHTML = '<div class="empty">No transcript events yet.</div>';
  } catch (e) {
    /* transient — next tick retries */
  } finally {
    txInflight = false;
    if (txAgain) { txAgain = false; refreshTranscript(); }  // coalesced re-run
  }
}

function setFrameKind(kind) {
  cancelAutoActionReturn();
  if (isRealtimeFrameKind(kind)) {
    lastRealtimeFrameKind = kind;
    autoActionPlayback = null;
  }
  if (PHYSICAL_CAMERAS.has(kind)) {
    selectedCamera = kind;
    publishSelectedCamera(kind);
  }
  frameKind = kind;
  if (kind !== "actionVideo") actionVideo = null;
  document.querySelectorAll(".frame-tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.kind === kind));
  frameIdx = -1;
  refreshFrame(undefined, { source: "user" });
}

function finishAutoActionPlayback() {
  if (!autoActionPlayback || autoActionReturnTimer) return;
  const playback = autoActionPlayback;
  autoActionReturnTimer = setTimeout(() => {
    autoActionReturnTimer = null;
    if (autoActionPlayback !== playback) return;
    const nextFrameIdx = playback.nextFrameIdx;
    const returnKind = playback.returnKind || lastRealtimeFrameKind || "agent";
    autoActionPlayback = null;
    actionVideo = null;
    frameKind = returnKind;
    frameIdx = -1;
    document.querySelectorAll(".frame-tabs button").forEach(b =>
      b.classList.toggle("active", b.dataset.kind === returnKind));
    // No video reset here — swapMedia keeps the finished video's last
    // frame painted until the realtime PNG is decoded, then flips visibility
    // — the transition never exposes the black framewrap background.
    refreshFrame(nextFrameIdx);
    refreshMeta({ autoPlayNewAction: true, nextFrameIdx });
  }, AUTO_ACTION_RETURN_DELAY_MS);
}

function playActionVideo(step, opts = {}) {
  if (!curRun || !step || !step.has_action_video) return false;
  cancelAutoActionReturn();
  actionVideo = step;
  autoActionPlayback = opts.auto || opts.returnAfterEnd
    ? {
        step: Number(step.step) || 0,
        nextFrameIdx: opts.nextFrameIdx,
        auto: !!opts.auto,
        returnKind: opts.returnKind || lastRealtimeFrameKind,
      }
    : null;
  frameKind = "actionVideo";
  document.querySelectorAll(".frame-tabs button").forEach(b => b.classList.remove("active"));
  frameIdx = -1;
  // Auto-triggered replays (from maybeAutoPlayNewAction) queue as "auto";
  // manual timeline clicks are user actions and jump the queue.
  refreshFrame(undefined, { source: opts.auto ? "auto" : "user" });
  return true;
}

function playEpisodeVideo() {
  if (!curRun || !episodeVideoAvailable) return;
  cancelAutoActionReturn();
  autoActionPlayback = null;
  actionVideo = null;
  frameKind = "video";
  document.querySelectorAll(".frame-tabs button").forEach(b => b.classList.remove("active"));
  frameIdx = -1;
  refreshFrame(undefined, { source: "user" });
}

function refreshFrame(idx, opts = {}) {
  if (!curRun) return;
  const source = opts.source || "auto";

  if (frameKind === "actionVideo") {
    if (!actionVideo) return;
    const stepNum = Number(actionVideo.step) || 0;
    // Note: no ``t=Date.now()`` cache-buster — action video files are
    // written once and never mutate, so the buffer's ``_loadedSrc`` cache
    // gives us instant replay when the same clip is re-clicked.
    const url = `/api/run/action-video?run=${encodeURIComponent(curRun)}&step=${encodeURIComponent(actionVideo.step)}`;
    const cap = `action #${actionVideo.step} ${actionVideo.action}`;
    swapMedia({
      kind: "video",
      url,
      cap,
      source,
      // Hold the queue until the clip ends so queued realtime frames don't
      // cut the replay short. User clicks (source: "user") still release
      // the hold on the current in-flight swap immediately.
      holdUntilEnded: true,
      onReady: (v) => {
        try { v.currentTime = 0; } catch {}
        v.playbackRate = 0.5;
        const shouldReturn =
          autoActionPlayback && autoActionPlayback.step === stepNum;
        v.muted = !!(shouldReturn && autoActionPlayback.auto);
        v.onended = shouldReturn ? finishAutoActionPlayback : null;
        const p = v.play();
        if (p && typeof p.catch === "function") {
          p.catch(() => { if (shouldReturn) finishAutoActionPlayback(); });
        }
      },
    });
    return;
  }

  if (frameKind === "video") {
    const url = `/api/run/video?run=${encodeURIComponent(curRun)}`;
    swapMedia({
      kind: "video",
      url,
      cap: "episode video",
      source,
      holdUntilEnded: true,
      onReady: (v) => {
        v.playbackRate = 1.0;
        v.muted = false;
        v.onended = null;
      },
    });
    return;
  }

  // realtime agent / camera frame — PNG mutates server-side, so
  // ``t=Date.now()`` keeps the URL unique per tick and defeats caching.
  if (idx != null && idx === frameIdx) return;
  frameIdx = idx ?? frameIdx;
  const url = `/api/run/frame?run=${encodeURIComponent(curRun)}&kind=${frameKind}&t=${Date.now()}`;
  swapMedia({
    kind: "img",
    url,
    cap: PHYSICAL_CAMERAS.has(frameKind)
      ? `${frameKind} - frame #${frameIdx}`
      : `${frameKind} · frame #${frameIdx}`,
    source,
  });
}

async function refreshMeta(opts = {}) {
  if (!curRun) return;
  const r = await fetch(`/api/run?run=${encodeURIComponent(curRun)}`).then(x => x.json());
  const behavior = isBehaviorRun(r);
  if (behavior && !behaviorControlsEnabled) {
    selectedCamera = "head";
    frameKind = "head";
    lastRealtimeFrameKind = "head";
    frameIdx = -1;
    document.querySelectorAll(".frame-tabs button").forEach(b =>
      b.classList.toggle("active", b.dataset.kind === "head"));
  } else if (!behavior && behaviorControlsEnabled && PHYSICAL_CAMERAS.has(frameKind)) {
    frameKind = "agent";
    lastRealtimeFrameKind = "agent";
    frameIdx = -1;
    document.querySelectorAll(".frame-tabs button").forEach(b =>
      b.classList.toggle("active", b.dataset.kind === "agent"));
  }
  setBehaviorControlMode(behavior);
  if (r.control) applyControlSnapshot(r.control);
  else if (behavior) refreshControlState();
  setBadge(r.state);
  setResult(r.terminated, r.state);
  $("#taskMeta").innerHTML = `<b>${r.suite ?? r.name}</b> · task ${r.task ?? "?"} · seed ${r.seed ?? "?"}`;
  if (r.usage) $("#usageMeta").textContent =
    `token in ${r.usage.in.toLocaleString()} · out ${r.usage.out.toLocaleString()} · ${r.usage.tool_calls} tools`;
  renderTimeline(r.timeline || [], r.has_video);
  renderToolContractMeta(r.metadata);
  if (opts.primeAutoActionStep) {
    autoActionLastStep = maxTimelineStep(r.timeline || []);
    autoActionPrimed = true;
  }
  const autoStarted = opts.autoPlayNewAction && autoActionPrimed && !autoActionPlayback
    ? maybeAutoPlayNewAction(
        r.timeline || [],
        opts.nextFrameIdx ?? r.frame_revisions?.[selectedCamera] ?? r.frame_idx)
    : false;
  if (!r.has_video && frameKind === "video") {
    setFrameKind(behaviorControlsEnabled ? selectedCamera : "agent");
  }
  if (
    !autoStarted
    && !autoActionPlayback
    && isRealtimeFrameKind(frameKind)
  ) refreshFrame(r.frame_revisions?.[selectedCamera] ?? r.frame_idx);
}

function connectSSE() {
  if (es) es.close();
  es = new EventSource(`/api/stream?run=${encodeURIComponent(curRun)}`);
  es.onmessage = (e) => {
    const sig = JSON.parse(e.data);
    setBadge(sig.state);
    setResult(sig.terminated, sig.state);
    if (sig.control) applyControlSnapshot(sig.control);
    if (sig.usage) $("#usageMeta").textContent =
      `tok in ${sig.usage.in.toLocaleString()} · out ${sig.usage.out.toLocaleString()} · ${sig.usage.tool_calls} tools`;
    $("#connMeta").textContent = "● live";
    refreshTranscript();
    // refresh timeline lazily on step change
    if (sig.n_steps !== connectSSE._steps) {
      connectSSE._steps = sig.n_steps;
      // Suppress realtime frame refreshes for the duration of the step
      // transition. ``refreshMeta`` is async (awaits ``/api/run``); during
      // that await, intermediate SSE snapshots carry the post-step
      // ``frame_idx`` but ``autoActionPlayback`` is not set yet, so the
      // realtime branch below would queue the completion image BEFORE
      // ``refreshMeta`` resolves and queues the action video — producing
      // the wrong order (image → video). The guard holds those ticks off
      // until ``refreshMeta`` finishes; if it queued an action video the
      // video's ``holdUntilEnded`` + ``autoActionPlayback`` take over the
      // suppression, and if it didn't, ``refreshMeta`` itself queues the
      // completion frame in the right place.
      stepTransitioning = true;
      refreshMeta({
        autoPlayNewAction: autoActionPrimed,
        primeAutoActionStep: !autoActionPrimed,
        nextFrameIdx: sig.frame_revisions?.[selectedCamera] ?? sig.frame_idx,
      }).finally(() => { stepTransitioning = false; });
      return;
    }
    if (sig.has_video && !episodeVideoAvailable) refreshMeta();
    if (
      !autoActionPlayback
      && !stepTransitioning
      && isRealtimeFrameKind(frameKind)
      && (sig.frame_revisions?.[selectedCamera] ?? sig.frame_idx) != null
      && (sig.frame_revisions?.[selectedCamera] ?? sig.frame_idx) !== frameIdx
    ) refreshFrame(sig.frame_revisions?.[selectedCamera] ?? sig.frame_idx);
  };
  es.onerror = () => { $("#connMeta").textContent = "○ reconnecting…"; };
}

async function selectRun(id) {
  await stopActiveLease("run_changed");
  cancelAutoActionReturn();
  curRun = id; evShown = 0; frameIdx = -1; connectSSE._steps = -1;
  curToolGroup = null;
  actionVideo = null;
  episodeVideoAvailable = false;
  autoActionLastStep = 0;
  autoActionPrimed = false;
  autoActionPlayback = null;
  stepTransitioning = false;
  selectedTarget = "chassis";
  selectedCamera = "head";
  controlsExpanded = true;
  setBehaviorControlMode(false);
  resetAllMedia();
  frameKind = "agent"; lastRealtimeFrameKind = "agent";
  document.querySelectorAll(".frame-tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.kind === "agent"));
  $("#transcript").innerHTML = '<div class="empty">Loading…</div>';
  $("#timeline").innerHTML = '<div class="empty">…</div>';
  $("#frameCap").textContent = "waiting for first frame…";
  refreshMeta({ primeAutoActionStep: true });
  refreshTranscript();
  connectSSE();
}

document.querySelectorAll(".frame-tabs button").forEach(btn => {
  btn.addEventListener("click", () => setFrameKind(btn.dataset.kind));
});
$("#showtools").addEventListener("change", (e) => {
  $("#transcript").classList.toggle("alltools", e.target.checked);
});

// --- draggable splitters ---
function setupSplitter(handle, opts) {
  // opts: { axis:'x'|'y', container, prop, min, max, store }
  const saved = localStorage.getItem(opts.store);
  if (saved) opts.container.style.setProperty(opts.prop, saved);
  handle.addEventListener("mousedown", (e) => {
    e.preventDefault();
    handle.classList.add("dragging");
    document.body.classList.add("resizing");
    document.body.style.cursor = opts.axis === "x" ? "col-resize" : "row-resize";
    const rect = opts.container.getBoundingClientRect();
    const move = (ev) => {
      let v = opts.axis === "x" ? ev.clientX - rect.left : ev.clientY - rect.top;
      const limit = opts.axis === "x" ? rect.width : rect.height;
      v = Math.max(opts.min, Math.min(v, limit - opts.max));
      const px = v + "px";
      opts.container.style.setProperty(opts.prop, px);
      localStorage.setItem(opts.store, px);
    };
    const up = () => {
      handle.classList.remove("dragging");
      document.body.classList.remove("resizing");
      document.body.style.cursor = "";
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  });
  // double-click to reset to default
  handle.addEventListener("dblclick", () => {
    opts.container.style.removeProperty(opts.prop);
    localStorage.removeItem(opts.store);
  });
}
setupSplitter($("#gutterV"), {
  axis: "x", container: $("main"), prop: "--leftw",
  min: 280, max: 320, store: "wm.leftw",
});
setupSplitter($("#gutterH"), {
  axis: "y", container: $(".col.right"), prop: "--frameh",
  min: 120, max: 160, store: "wm.frameh",
});

// --- launcher (start screen) ---
function populateModelPresets(planner, selected = "") {
  const preset = $("#f-model_preset");
  const current = selected || preset.value || "";
  preset.innerHTML = "";
  for (const value of (MODEL_PRESETS[planner] || [""])) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value || (planner === "api" ? "select a model" : "backend default");
    preset.appendChild(option);
  }
  preset.value = (MODEL_PRESETS[planner] || []).includes(current) ? current : "";
}

function updateBackendFields() {
  const planner = $("#f-planner").value;
  document.querySelectorAll("[data-backends]").forEach(el => {
    const allowed = (el.dataset.backends || "").split(/\s+/);
    el.classList.toggle("hidden", !allowed.includes(planner));
  });
  const currentModel = $("#f-model_custom").value || $("#f-model_preset").value;
  populateModelPresets(planner, currentModel);
}

function selectedModel() {
  return $("#f-model_custom").value.trim() || $("#f-model_preset").value.trim();
}

function showLauncher(defaults) {
  const d = defaults || {};
  const set = (id, val) => { $(id).value = val == null ? "" : val; };
  set("#f-suite", d.suite);
  set("#f-task", d.task);
  set("#f-seed", d.seed);
  set("#f-planner", d.planner || "claude_code");
  set("#f-max-turns", d["max-turns"]);
  set("#f-max-tokens", d["max-tokens"]);
  set("#f-max-episode-steps", d["max-episode-steps"]);
  set("#f-planner-timeout-s", d["planner-timeout-s"]);
  set("#f-claude-code-max-budget-usd", d["claude-code-max-budget-usd"]);
  set("#f-cuda-device", d["cuda-device"]);
  populateModelPresets($("#f-planner").value, d.model || "");
  if ((MODEL_PRESETS[$("#f-planner").value] || []).includes(d.model || "")) {
    set("#f-model_custom", "");
  } else {
    set("#f-model_custom", d.model);
  }
  updateBackendFields();
  $("#launcher").classList.remove("hidden");
}

function collectLaunchConfig() {
  const numOrNull = (id) => {
    const v = $(id).value.trim();
    return v === "" ? null : Number(v);
  };
  return {
    suite: $("#f-suite").value.trim(),
    task: numOrNull("#f-task"),
    seed: numOrNull("#f-seed"),
    planner: $("#f-planner").value,
    "max-turns": numOrNull("#f-max-turns"),
    "max-tokens": numOrNull("#f-max-tokens"),
    "max-episode-steps": numOrNull("#f-max-episode-steps"),
    model: selectedModel(),
    "planner-timeout-s": numOrNull("#f-planner-timeout-s"),
    "claude-code-max-budget-usd": numOrNull("#f-claude-code-max-budget-usd"),
    "cuda-device": $("#f-cuda-device").value.trim(),
  };
}

async function pollForRun() {
  try {
    const r = await fetch("/api/runs").then(x => x.json());
    if (r.runs && r.runs.length) {
      $("#launcher").classList.add("hidden");
      loadRun();
      return;
    }
  } catch (e) { /* transient — retry */ }
  setTimeout(pollForRun, 600);
}

async function onRun() {
  const config = collectLaunchConfig();
  const requiredNums = [
    ["Task", config.task],
    ["Seed", config.seed],
    ["Max turns", config["max-turns"]],
    ["Max episode steps", config["max-episode-steps"]],
  ];
  if (config.planner === "api") requiredNums.push(["Max tokens", config["max-tokens"]]);
  const badNum = requiredNums.find(([_, v]) => v == null || !Number.isFinite(v));
  if (!config.suite || badNum) {
    $("#launchStatus").textContent = !config.suite
      ? "Suite is required."
      : `${badNum[0]} is required.`;
    return;
  }
  if (config.planner === "api" && (!config.model || !config.model.includes(":"))) {
    $("#launchStatus").textContent = "API model must include a provider prefix, for example anthropic:claude-opus-4-8.";
    return;
  }
  $("#runBtn").disabled = true;
  $("#launchStatus").textContent =
    "starting run… this page will switch to the live monitor.";
  try {
    const resp = await fetch("/api/launch/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(config),
    });
    if (!resp.ok) throw new Error(await resp.text());
  } catch (e) {
    $("#runBtn").disabled = false;
    $("#launchStatus").textContent = "failed to start — check the terminal.";
    return;
  }
  pollForRun();
}
$("#runBtn").addEventListener("click", onRun);
$("#f-planner").addEventListener("change", () => {
  $("#f-model_custom").value = "";
  $("#launchStatus").textContent = "";
  updateBackendFields();
});

async function boot() {
  let st = { enabled: false };
  try { st = await fetch("/api/launch/state").then(x => x.json()); } catch (e) {}
  if (st.enabled && st.pending) {
    showLauncher(st.defaults);
  } else {
    // launcher already submitted (page reloaded) or not armed — go to monitor
    loadRun();
  }
}

boot();
</script>
