<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RPent · 实时监控</title>
<style>
  :root {
    --bg: #f6f1e8; --panel: #fffdf8; --panel2: #efe7d8; --border: #d8cfbe;
    --fg: #3b3934; --muted: #877f70; --accent: #2f6fd6;
    --green: #2f8a3e; --red: #c8392f; --yellow: #b07a0a; --purple: #7a52c4;
    --tool: #1d6fc5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header h1 .dot { color: var(--accent); }
  select {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 11px; font-size: 15px; max-width: 460px;
  }
  .badge {
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .5px; border: 1px solid transparent;
  }
  .b-running { background: rgba(47,138,62,.14); color: var(--green); border-color: var(--green); animation: pulse 1.6s infinite; }
  .b-done { background: rgba(47,111,214,.14); color: var(--accent); border-color: var(--accent); }
  .b-stale { background: rgba(135,127,112,.16); color: var(--muted); border-color: var(--muted); }
  .b-ok { background: rgba(47,138,62,.14); color: var(--green); border-color: var(--green); }
  .b-fail { background: rgba(200,57,47,.12); color: var(--red); border-color: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  .meta { color: var(--muted); font-size: 13px; }
  .meta b { color: var(--fg); font-weight: 600; }
  .grow { flex: 1; }

  main { flex: 1; display: grid; grid-template-columns: var(--leftw, 1.4fr) 6px 1fr; gap: 0; min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .col.right {
    display: grid; grid-template-rows: var(--frameh, 42vh) 6px 1fr; min-height: 0;
    container-type: inline-size; container-name: dashboard-right;
  }

  /* draggable splitters */
  .gutter { background: var(--border); position: relative; z-index: 5; }
  .gutter::after { content: ""; position: absolute; inset: 0; }
  .gutter:hover, .gutter.dragging { background: var(--accent); }
  .gutter-v { cursor: col-resize; }
  .gutter-v::after { left: -3px; right: -3px; }   /* fatter hit area */
  .gutter-h { cursor: row-resize; }
  .gutter-h::after { top: -3px; bottom: -3px; }
  body.resizing { cursor: inherit; user-select: none; }
  body.resizing iframe, body.resizing .frame-media { pointer-events: none; }
  .panel-title {
    padding: 10px 16px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .panel-title .count { color: var(--fg); font-weight: 600; }

  /* transcript */
  #transcript { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .ev { margin-bottom: 8px; }
  .ev.turn { color: var(--purple); font-weight: 600; font-size: 13.5px;
    border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 10px; }
  .ev.text { white-space: pre-wrap; word-wrap: break-word; }
  .ev.thinking details {
    background: rgba(210,153,34,.08); border: 1px solid rgba(210,153,34,.35);
    border-radius: 6px; padding: 6px 9px;
  }
  .ev.thinking summary {
    color: var(--yellow); cursor: pointer; font-size: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .ev.thinking pre {
    white-space: pre-wrap; word-wrap: break-word; margin: 8px 0 0;
    color: var(--fg); font: inherit;
  }
  .ev.meta { color: var(--muted); font-size: 13px; font-style: italic; }
  .ev.tool_call, .ev.tool_result {
    font-size: 13.5px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 9px; overflow-x: auto;
  }
  .ev.tool_call { border-left: 3px solid var(--tool); }
  .ev.tool_result { border-left: 3px solid var(--muted); opacity: .85; }
  .ev .tname { color: var(--accent); font-weight: 600; }
  .ev .tname.err { color: var(--red); }
  .ev .args { color: var(--muted); }

  /* collapsible tool-call group */
  .toolgroup { margin: 6px 0; }
  .tg-head {
    font-size: 13.5px;
    color: var(--muted); cursor: pointer; user-select: none; padding: 3px 6px;
    border-radius: 6px; display: inline-block;
  }
  .tg-head:hover { color: var(--fg); background: var(--panel2); }
  .tg-head::before { content: "▸ "; color: var(--tool); }
  .tg-body { display: none; margin-top: 4px; }
  .toolgroup.open > .tg-body,
  #transcript.alltools .tg-body { display: block; }
  .toolgroup.open > .tg-head::before,
  #transcript.alltools .tg-head::before { content: "▾ "; }
  #transcript.alltools .tg-head { pointer-events: none; }
  .tg-body .ev { margin-bottom: 5px; }

  /* frame + compact BEHAVIOR manual controls */
  .framewrap {
    background: #e3dccd; border-bottom: 1px solid var(--border);
    position: relative; min-height: 200px; display: grid;
    grid-template-columns: minmax(168px, .52fr) minmax(260px, 1fr) minmax(168px, .5fr);
    overflow: hidden; container-type: size; container-name: behavior-frame;
  }
  .framewrap:not(.behavior-mode),
  .framewrap.controls-collapsed { grid-template-columns: 1fr; }
  .frame-stage {
    grid-column: 2; position: relative; min-width: 0; min-height: 0;
    background: #e3dccd; overflow: hidden;
  }
  .framewrap:not(.behavior-mode) .frame-stage,
  .framewrap.controls-collapsed .frame-stage { grid-column: 1; }
  .frame-media {
    position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
    /* Hidden buffers still occupy layout — visibility keeps intrinsic sizing
       correct so the visible sibling doesn't re-flow on swap. Pointer events
       are disabled so the hidden video's controls don't intercept clicks. */
    visibility: hidden; pointer-events: none;
  }
  .frame-media.visible { visibility: visible; pointer-events: auto; }
  .frame-tabs { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 2; }
  .frame-tabs button {
    background: rgba(255,253,248,.85); color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  .frame-tabs button.active { color: var(--fg); border-color: var(--accent); background: var(--panel); }
  .behavior-frame-tabs { display: none; z-index: 5; top: 4px; right: 2px; gap: 7.5px; }
  .behavior-frame-tabs button {
    height: 23px; padding: 3px 8px; font-size: 12px;
  }
  .behavior-frame-tabs button[data-camera="head"] { width: 48px; }
  .behavior-frame-tabs button[data-camera="left_wrist"] { width: 63px; }
  .behavior-frame-tabs button[data-camera="right_wrist"] { width: 70px; }
  .framewrap.behavior-mode .legacy-frame-tabs { display: none; }
  .framewrap.behavior-mode .behavior-frame-tabs { display: flex; }
  .frame-cap { position: absolute; bottom: 8px; left: 10px; font-size: 13px; color: #f6f1e8;
    background: rgba(74,60,46,.72); padding: 3px 9px; border-radius: 4px; z-index: 6; }

  .control-rail {
    position: relative; z-index: 3; min-width: 0; padding: 8px 9px 7px;
    background:
      radial-gradient(circle at 45% 20%, rgba(255,255,255,.11), transparent 48%),
      #ebe4d7;
    color: var(--fg); font-size: 12px; line-height: 1.15;
    display: none; flex-direction: column; align-items: center;
  }
  .framewrap.behavior-mode:not(.controls-collapsed) .control-rail { display: flex; }
  .control-left { grid-column: 1; border-right: 1px solid #d1c6b5; }
  .control-right { grid-column: 3; border-left: 1px solid #d1c6b5; }
  .controls-toggle {
    width: min(162px, 100%); height: 27px; flex: 0 0 27px; margin: 0 0 12px;
    display: inline-flex; align-items: center; justify-content: space-between;
    padding: 0 10px; border: 1px solid #bdb2a1; border-radius: 5px;
    background: linear-gradient(#fffefa, #f5f0e8); color: #6f675c; font: inherit;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.9),
      0 1px 2px rgba(68,54,41,.25);
    cursor: pointer;
  }
  .controls-toggle:hover { background: linear-gradient(#fbf8f2, #ebe3d7); border-color: #a99d8a; }
  .controls-toggle:active {
    transform: translateY(1px); background: #e1d7c8;
    box-shadow: inset 0 1px 2px rgba(68,54,41,.19);
  }
  .controls-toggle .chevron {
    color: #554d42; font-size: 13px; line-height: 1; transition: transform .12s ease;
  }
  .controls-toggle[aria-expanded="false"] .chevron { transform: rotate(180deg); }
  .collapsed-toggle {
    display: none; position: absolute; top: 8px; left: 9px; z-index: 5;
    width: 162px; margin: 0;
  }
  .framewrap.behavior-mode.controls-collapsed .collapsed-toggle { display: inline-flex; }
  .target-row { display: flex; gap: 8px; justify-content: center; width: 100%; min-height: 26px; }
  .target-button {
    box-sizing: border-box; width: 76px; height: 26px; flex: 0 0 76px;
    margin: 0; padding: 0 7px; color: #5c564d;
    background: linear-gradient(#fffefa, #eee8de);
    border: 1px solid #b5aa99; border-radius: 5px;
    font: 12px/24px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    white-space: nowrap;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.88),
      0 2px 3px rgba(63,50,38,.28);
    cursor: pointer;
  }
  .target-button:hover:not([aria-disabled="true"]) {
    background: linear-gradient(#faf6ef, #e3dacd); border-color: #9e927f;
  }
  .target-button:active:not([aria-disabled="true"]), .target-button.pressed {
    transform: translateY(1px); background: #d9cebe;
    box-shadow: inset 0 1px 2px rgba(63,50,38,.2);
  }
  .target-button.selected {
    color: #315572; border-color: #8ea6b8;
    background: linear-gradient(#f1f6f9, #dce7ee);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.88),
      0 2px 3px rgba(63,50,38,.28);
  }
  .target-button[aria-disabled="true"] {
    color: #938a7d; background: linear-gradient(#f8f4ed, #e7dfd3);
    border-color: #c4b9a8;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.7),
      0 1px 2px rgba(63,50,38,.18);
    cursor: not-allowed;
  }
  .target-button.selected[aria-disabled="true"] {
    color: #7d8790; border-color: #b4bdc4;
    background: linear-gradient(#f1f3f4, #e1e5e7);
  }
  .control-left .target-row { margin-bottom: 25px; }
  .control-left .controls-toggle {
    left: -2px; position: relative; margin-bottom: 34px;
  }
  .control-left .target-row { transform: translateX(-4.5px); }
  .control-right .target-row {
    gap: 9px; margin-top: 61px; margin-bottom: 36px; transform: translateX(5px);
  }
  .control-section { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .dpad-wrap { position: relative; width: 152px; height: 151px; margin-top: 0; }
  .dpad {
    position: absolute; left: 21.58px; top: 26px; width: 96px; height: 96px;
  }
  .dpad::before, .dpad::after {
    content: ""; position: absolute;
    background: linear-gradient(135deg, #f3eee6, #dfd5c6);
    border: 1px solid #b7ab99;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.72),
      0 2px 3px rgba(63,50,38,.26);
  }
  .dpad::before { left: 32px; top: 0; width: 32px; height: 96px; border-radius: 7px; }
  .dpad::after { left: 0; top: 32px; width: 96px; height: 32px; border-radius: 7px; }
  .control-button {
    position: relative; z-index: 2; margin: 0; padding: 0;
    color: #61584c; background: linear-gradient(#fffefa, #eee8df);
    border: 1px solid #b6aa98;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.86),
      0 2px 3px rgba(63,50,38,.28);
    cursor: pointer; user-select: none; touch-action: none;
    font: 600 19px/1 -apple-system, "Segoe UI Symbol", "Segoe UI", sans-serif;
  }
  .control-button:hover:not([aria-disabled="true"]) {
    color: #554e45; border-color: #9f9481; background: linear-gradient(#f8f3eb, #ddd3c4);
  }
  .control-button:active:not([aria-disabled="true"]),
  .control-button.pressed {
    color: #433d35; background: #d3c8b8; transform: translateY(1px);
    box-shadow: inset 0 1px 2px rgba(67,56,43,.2);
  }
  .control-button[aria-disabled="true"] {
    color: #938a7d; background: linear-gradient(#f8f4ed, #e7dfd3);
    border-color: #c4b9a8;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.7),
      0 1px 2px rgba(63,50,38,.18);
    cursor: not-allowed;
  }
  .control-button.error, .target-button.error {
    border-color: var(--red); box-shadow: 0 0 0 1px rgba(200,57,47,.18);
  }
  .control-button::after, .target-button::after {
    content: attr(data-tooltip); position: absolute; left: 50%; bottom: calc(100% + 7px);
    transform: translateX(-50%); width: max-content; max-width: 230px;
    padding: 5px 7px; color: #fffdf8; background: rgba(59,57,52,.94);
    border-radius: 4px; font: 11px/1.3 -apple-system, "Segoe UI", sans-serif;
    white-space: normal; text-align: left; pointer-events: none;
    opacity: 0; visibility: hidden; transition: opacity .1s; z-index: 20;
  }
  .control-button:hover::after, .control-button:focus-visible::after,
  .target-button:hover::after, .target-button:focus-visible::after {
    opacity: 1; visibility: visible;
  }
  .control-right .control-button::after, .control-right .target-button::after {
    left: auto; right: 0; transform: none;
  }
  .control-left .control-button::after, .control-left .target-button::after {
    left: 0; transform: none;
  }
  .dpad .control-button {
    position: absolute; width: 32px; height: 32px; border: 0; background: transparent;
    box-shadow: none; border-radius: 5px; font-size: 13px;
  }
  .control-icon {
    display: block; width: 22px; height: 22px; margin: auto;
    overflow: visible; pointer-events: none;
  }
  .dpad-icon { width: 13px; height: 13px; }
  .observe-icon { width: 24px; height: 18px; }
  .rotate-icon { width: 23px; height: 23px; }
  .gripper-icon { width: 24px; height: 24px; }
  .gripper-icon .grip-dark { fill: currentColor; }
  .gripper-icon .grip-mid { fill: #b5aea4; }
  .gripper-icon .grip-accent { fill: #eea631; }
  .control-button[aria-disabled="true"] .gripper-icon .grip-mid { fill: #c5bdb1; }
  .control-button[aria-disabled="true"] .gripper-icon .grip-accent { fill: #cbb68e; }
  .dpad .control-button:hover:not([aria-disabled="true"]) { background: rgba(184,173,155,.27); }
  .dpad .control-button.pressed { background: rgba(132,119,101,.28); transform: translateY(1px); }
  .dpad-up { left: 32px; top: 0; }
  .dpad-down { left: 32px; bottom: 0; }
  .dpad-left { left: 0; top: 32px; }
  .dpad-right { right: 0; top: 32px; }
  .dpad-label { position: absolute; color: #403b35; font-size: 12px; line-height: 1.05; text-align: center; }
  .label-forward { top: 0; left: 47px; width: 58px; }
  .label-backward { bottom: 0; left: 43px; width: 66px; }
  .label-left { left: -12px; top: 61px; width: 25px; }
  .label-right { right: -5px; top: 61px; width: 31px; }
  .round-button {
    width: 39px; height: 39px; border-radius: 50%; flex: 0 0 39px;
  }
  .observe-wrap {
    margin-top: 16px; display: flex; flex-direction: column; align-items: center;
    gap: 5px; transform: translateX(-7px);
  }
  .observe-wrap .round-button { font-size: 18px; }
  .button-caption { color: #403b35; font-size: 12px; line-height: 1.1; text-align: center; }
  .function-grid {
    display: grid; grid-template-columns: 64px 64px; column-gap: 16px; row-gap: 29px;
    align-items: start; justify-content: center; transform: translateX(6px);
  }
  .function-key { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 64px; }
  .function-key .round-button { font-size: 22px; }
  .function-key.gripper .round-button { font-size: 17px; }
  .control-status {
    min-height: 13px; margin-top: auto; padding-top: 7px; color: var(--muted);
    font-size: 10px; line-height: 1; text-transform: capitalize;
  }
  .control-status.error { color: var(--red); }
  .col.right > .col .panel-title { padding: 7px 14px; }
  @container behavior-frame (min-height: 430px) {
    .control-rail { padding-top: 14.6667px; }
    .behavior-frame-tabs { top: 10.6667px; }
    .control-left .controls-toggle { margin-bottom: 58.3333px; }
    .control-left .target-row { margin-bottom: 15px; }
    .control-right .target-row { margin-top: 85.3333px; margin-bottom: 30px; }
    .observe-wrap { margin-top: 20px; }
  }
  @container dashboard-right (min-width: 830px) and (max-width: 900px) {
    .framewrap {
      grid-template-columns: 216.6667px minmax(0, 1fr) 212px;
    }
  }
  @media (max-width: 820px) {
    .framewrap {
      grid-template-columns: minmax(150px, .48fr) minmax(230px, 1fr) minmax(150px, .47fr);
    }
    .control-rail { padding-left: 5px; padding-right: 5px; }
    .controls-toggle { width: 145px; }
    .control-right .target-row { gap: 4px; }
    .function-grid { column-gap: 9px; }
  }

  /* timeline */
  #timeline { overflow-y: auto; padding: 6px 0; }
  .step { display: flex; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--border); font-size: 15px; }
  .step:hover { background: var(--panel2); }
  .step.hasclip { cursor: pointer; }
  .step.episode { cursor: pointer; background: rgba(47,111,214,.08); }
  .step.hasclip .idx::after { content: "▶"; color: var(--green); font-size: 10px; margin-left: 4px; }
  .step.episode .idx::after { content: "▶"; color: var(--accent); font-size: 10px; margin-left: 4px; }
  .step .idx { color: var(--muted); width: 30px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .step .body { min-width: 0; flex: 1; }
  .step .act { font-weight: 600; color: var(--accent); }
  .step .det { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .el { color: var(--muted); font-size: 12px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .step.term { background: rgba(47,138,62,.08); }

  /* launcher (start screen) */
  #launcher {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px; overflow-y: auto;
  }
  #launcher.hidden { display: none; }
  .launch-card {
    width: 100%; max-width: 680px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 32px 34px;
    box-shadow: 0 12px 40px rgba(60,50,40,.18);
  }
  .launch-card h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  .launch-card h2 .dot { color: var(--accent); }
  .launch-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .lform { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .lfield { display: flex; flex-direction: column; gap: 6px; }
  .lfield.full { grid-column: 1 / -1; }
  .lfield.hidden { display: none; }
  .lfield label { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .lfield input[type=text], .lfield input[type=number], .lfield select {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 11px; font-size: 15px; width: 100%; max-width: none;
  }
  .lcheck { flex-direction: row; align-items: center; gap: 8px; }
  .lcheck label { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--fg); }
  .launch-actions { display: flex; align-items: center; gap: 14px; margin-top: 24px; }
  #runBtn {
    background: var(--green); color: #07210e; border: none; border-radius: 8px;
    padding: 12px 30px; font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: .3px;
  }
  #runBtn:hover { filter: brightness(1.08); }
  #runBtn:disabled { opacity: .55; cursor: default; }
  #launchStatus { color: var(--muted); font-size: 14px; }
  @media (max-width: 720px), (max-height: 620px) {
    #launcher { padding: 12px; }
    .launch-card { padding: 18px; }
    .lform { grid-template-columns: 1fr; gap: 12px; }
  }

  .empty { color: var(--muted); padding: 24px 14px; font-style: italic; font-size: 14px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #c9bea9; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <div id="launcher" class="hidden">
    <div class="launch-card">
      <h2><span class="dot">●</span> RPent · 新建任务</h2>

<script>
const $ = (s) => document.querySelector(s);
let curRun = null, evShown = 0, frameKind = "agent", es = null, frameIdx = -1;
let actionVideo = null;
let episodeVideoAvailable = false;
let lastRealtimeFrameKind = "agent";
let autoActionLastStep = 0;
let autoActionPrimed = false;
let autoActionPlayback = null;

let controlsExpanded = true;

let desiredTarget = "chassis";
let targetTransitionGeneration = 0;

let publishedCamera = "head";
let cameraSelectionQueue = Promise.resolve();

let runSelectionGeneration = 0;
